name: Build y pruebas

# Corre en un runner Windows real (no macOS): es la primera verificación de verdad de
# que RelojChecador.WPF compila, pasa sus pruebas y arranca en Windows, sin depender de
# tener una VM local siempre encendida.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # necesario para que el paso "Actualizar la captura en el repo" pueda hacer push

jobs:
  build-and-test:
    name: Compilar y probar (Windows)
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publicar RelojChecador.WPF (self-contained win-x86)
        # win-x86, no win-x64: zkemkeeper.dll (SDK real de ZKTeco, ver
        # third-party/zkteco-sdk/README.md) es un COM server de 32 bits — un proceso de
        # 64 bits no puede activarlo por interop.
        run: >
          dotnet publish src/RelojChecador.WPF/RelojChecador.WPF.csproj
          -c Release -r win-x86 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o installer/publish

      - name: Subir ejecutable publicado
        uses: actions/upload-artifact@v4
        with:
          name: RelojChecador-win-x86
          path: installer/publish/

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar el instalador (Setup.exe) con Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\RelojChecador.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe falló con código $LASTEXITCODE" }

      - name: Subir el instalador generado
        uses: actions/upload-artifact@v4
        with:
          name: RelojChecador-Setup
          path: installer/output/*.exe

      - name: Capturar pantalla de la app (evidencia visual, best-effort)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "installer/publish/RelojChecador.WPF.exe"
          if (Test-Path $exe) {
            $proc = Start-Process $exe -PassThru
            Start-Sleep -Seconds 6

            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            # Nota: se evita a propósito el here-string "@ ... "@" de PowerShell aquí — su
            # delimitador de cierre debe ir sin indentación al inicio de línea, lo cual rompe
            # la indentación consistente que exige el bloque literal de YAML (run: |) y hace
            # que el workflow ni siquiera se dispare (error de parseo silencioso en GitHub).
            $win32Src = 'using System; using System.Runtime.InteropServices; ' +
              'public class Win32 { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect); ' +
              'public struct RECT { public int Left, Top, Right, Bottom; } }'
            Add-Type -TypeDefinition $win32Src

            $proc.Refresh()
            $hwnd = $proc.MainWindowHandle
            $rect = New-Object Win32+RECT
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            if ($hwnd -ne [IntPtr]::Zero -and [Win32]::GetWindowRect($hwnd, [ref]$rect)) {
              # Recorta justo a la ventana de la app en vez de la pantalla completa —
              # así la captura que se embebe en el README no arrastra el escritorio/taskbar
              # del runner de CI alrededor.
              $x = [Math]::Max(0, $rect.Left)
              $y = [Math]::Max(0, $rect.Top)
              $w = [Math]::Min($bounds.Width - $x, $rect.Right - $rect.Left)
              $h = [Math]::Min($bounds.Height - $y, $rect.Bottom - $rect.Top)
              $captureBounds = New-Object System.Drawing.Rectangle $x, $y, $w, $h
            } else {
              Write-Warning "No se pudo obtener el handle de la ventana; se captura la pantalla completa."
              $captureBounds = $bounds
            }

            $bitmap = New-Object System.Drawing.Bitmap $captureBounds.Width, $captureBounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($captureBounds.Location, [System.Drawing.Point]::Empty, $captureBounds.Size)
            New-Item -ItemType Directory -Force -Path docs/screenshots | Out-Null
            $bitmap.Save("docs/screenshots/sucursales.png")
            Get-Process -Name "RelojChecador.WPF" -ErrorAction SilentlyContinue | Stop-Process -Force
          } else {
            Write-Warning "No se encontró el ejecutable publicado; se omite la captura."
          }

      - name: Subir captura de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: docs/screenshots/sucursales.png
          if-no-files-found: ignore

      - name: Actualizar la captura en el repo (solo push a main)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          if [ -f docs/screenshots/sucursales.png ] && ! git diff --quiet -- docs/screenshots/sucursales.png; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/sucursales.png
            git commit -m "docs: actualizar captura de pantalla de la interfaz [skip ci]"
            git push
          else
            echo "Sin cambios en la captura; nada que subir."
          fi
